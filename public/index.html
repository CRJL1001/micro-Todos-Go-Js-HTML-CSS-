<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="/static/assets/js/todosScript.js"></script>
    <link rel="stylesheet" href="/static/assets/style/style.css">
    <script src="../static/assets/js/helper.js"></script>
</head>
<body class="relative">
    <div class="pointer-events-none absolute inset-0 backdrop-blur-sm [mask-image:linear-gradient(to_right,black,transparent_100%)]" aria-hidden="true"></div>
    <header class="relative z-10 flex justify-between items-center">
        <div class="flex justify-center items-center gap-2 m-5 ml-45">
            <img src="/static/assets/svg/check_box_title.svg" alt="checkbox svg" class="w-10 h-10">
            <h1 class="text-2xl leading-none font-bold">Todos.</h1>
        </div>
        <h2 class="text-xl backdrop-blur-[2px] p-5 m-5 mr-45 rounded-xl">Moins de désordre.</h2>
    </header>
    <div class="new-task relative z-10 mt-4 flex justify-center text-center">
        <form action="" >
            <label class="text-3xl" for="new-task">Nouvelle tâche</label><br>
            <div class="mt-5 flex items-center gap-2">
                <input id="new-task" class="border-2 rounded-sm p-3" type="text" placeholder="task name">
                <button id="add-btn" class="focus:border-0" type="button"><img id="add-btn-icon" src="/static/assets/svg/add_box.svg" alt="bouton d'ajout"></button>
            </div>
        </form>
    </div>
    <div class="todo-list relative z-10 text-center w-full mt-6">
        <h1 class="text-3xl">Tâches à faire : </h1>
        <ul id="todo-ul">
        </ul>
    </div>


</body>
</html>
